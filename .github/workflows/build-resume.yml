name: Build LaTeX Resume
on:
  push:
    branches:
      - master
    paths:
      - 'latex-resume/**'
      - '.github/workflows/build-resume.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install fonts
        run: |
          apt-get update
          apt-get install --yes fonts-roboto fonts-adobe-sourcesans3

      - name: Compile Resume
        run: |
          cd latex-resume
          lualatex resume.tex
          lualatex resume.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: latex-resume/resume.pdf

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: resume-pdf
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: resume.pdf
          tag_name: latest-resume
          name: Latest Resume
          body: "Automatically compiled LaTeX resume."
