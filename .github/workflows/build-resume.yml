name: Build LaTeX Resume
on:
  push:
    branches:
      - master
    paths:
      - 'latex-resume/**'
      - '.github/workflows/build-resume.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          working_directory: latex-resume
          latexmk_use_xelatex: true

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: latex-resume/resume.pdf

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master'
        with:
          files: latex-resume/resume.pdf
          tag_name: latest-resume
          name: Latest Resume
          body: "Automatically compiled LaTeX resume."
